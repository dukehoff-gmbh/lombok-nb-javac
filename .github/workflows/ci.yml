name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # the plugin and its unit tests; validate checks the license headers
      - name: Build
        run: mvn -B -ntp clean package

      # the demo builds with its old Lombok: the errors it shows in NetBeans are not real
      - name: Demo
        working-directory: demo
        run: mvn -B -ntp -q package && java -cp target/classes demo.Main
