OpenIDE-Module-Name=Lombok for nb-javac
OpenIDE-Module-Display-Category=Java
OpenIDE-Module-Short-Description=Lombok in the editor when a project's Lombok is too old for NetBeans' javac
OpenIDE-Module-Long-Description=NetBeans parses Java with nb-javac, often a newer javac than the project builds with, \
    and Lombok supports each javac only from a certain release on (the javac of NetBeans 31 from Lombok 1.18.48). \
    With an older Lombok the editor shows false "cannot find symbol" errors for getters, builders and other \
    generated members. This plugin uses its bundled Lombok inside the IDE instead of an older one on a project's \
    annotation processor path. The project's build and files are not changed. Restart NetBeans after installing.
